name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # A personal token (RELEASE_PLEASE_TOKEN) lets the release PR trigger CI;
      # GITHUB_TOKEN works as a fallback but its PRs do not run workflows.
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
